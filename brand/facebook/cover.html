<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1640px;height:856px;overflow:hidden}
body{position:relative;background:#141414;font-family:Manrope,sans-serif;color:#faf7f2}
.img{position:absolute;inset:0 0 0 46%;background:url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=1600&q=80&auto=format&fit=crop') center/cover}
.img:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#141414 0%,rgba(20,20,20,.55) 30%,rgba(20,20,20,.05) 100%)}
/* keep text inside the safe area (centre ~1000px wide on mobile) */
.txt{position:absolute;left:330px;top:50%;transform:translateY(-50%);max-width:760px}
.eyebrow{font-size:22px;letter-spacing:9px;color:#c9a46a;font-weight:700}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:96px;line-height:1.02;margin:22px 0 0}
h1 em{color:#e6d3b0}
p{font-size:28px;color:#d8d2c8;margin:26px 0 0}
.chips{display:flex;gap:14px;margin-top:34px}
.chip{border:1.5px solid rgba(201,164,106,.7);border-radius:999px;padding:12px 24px;font-size:20px;font-weight:600}
</style></head><body><div class="img"></div>
<div class="txt"><div class="eyebrow">AH CLOTHING HUB</div><h1>Modern heritage,<br>made in <em>Pakistan</em></h1>
<p>Eastern &amp; western wear · Shop online at ahclothinghub.vercel.app</p>
<div class="chips"><span class="chip">Cash on Delivery</span><span class="chip">Delivery across Pakistan</span></div></div></body></html>
